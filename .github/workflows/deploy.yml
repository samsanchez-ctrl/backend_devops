name: Main Backend
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: samsanchez-ctrl
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: samsanchez-ctrl/backend_devops:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Private EC2 via SSH Proxy
        uses: appleboy/ssh-action@master
        with:
          host: 10.0.137.129            # IP Privada App
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # FRONTEND COMO PUENTE PARA QUE GITHUB ACCEDA A APP:
          proxy_host: 13.218.146.246 # IP pública de Web
          proxy_username: ec2-user
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull samsanchez-ctrl/backend_devops:latest
            sudo docker stop backend || true
            sudo docker rm backend || true
            sudo docker run -d --name backend -p 3001:3001 \
            -e DB_HOST=10.0.153.106 \
            -e DB_USER=alumno \
            -e DB_PASSWORD=alumno123 \
            -e DB_NAME=tienda_perritos \
            samsanchez-ctrl/backend_devops:latest